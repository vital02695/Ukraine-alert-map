<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Карта загроз</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0b1220; --card:#121b2e; --txt:#e8eef8; --mut:#8fa0bd; --red:#ff1744; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:14px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; }
  #map { position:fixed; inset:0; background:var(--bg); }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.8) saturate(.5); }
  .bar { position:fixed; left:8px; right:8px; top:calc(8px + env(safe-area-inset-top)); z-index:1000;
    background:rgba(18,27,46,.92); backdrop-filter:blur(8px); border:1px solid #223253; border-radius:14px;
    padding:8px 10px; display:flex; align-items:center; gap:8px; }
  .bar .t { font-weight:700; }
  .bar .s { color:var(--mut); font-size:12px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { width:9px; height:9px; border-radius:50%; background:#777; flex:none; }
  .dot.ok { background:#00e676; } .dot.bad { background:#ff5252; }
  .btn { background:#1b2a47; border:1px solid #2b3f68; color:var(--txt); border-radius:10px;
    width:38px; height:38px; font-size:18px; flex:none; display:grid; place-items:center; }
  .btn:active { background:#25396180; }
  .fab { position:fixed; right:10px; z-index:1000; }
  #locBtn { bottom:calc(18px + env(safe-area-inset-bottom)); }
  #legBtn { bottom:calc(64px + env(safe-area-inset-bottom)); }
  #alerts { position:fixed; left:8px; right:8px; top:calc(62px + env(safe-area-inset-top)); z-index:999;
    display:none; background:rgba(255,23,68,.92); color:#fff; border-radius:12px; padding:6px 10px; font-size:12.5px; font-weight:600; }
  #legend { position:fixed; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:1001; display:none;
    background:rgba(18,27,46,.96); border:1px solid #223253; border-radius:14px; padding:10px; max-height:55vh; overflow:auto; }
  #legend .row { display:flex; align-items:center; gap:10px; padding:4px 0; }
  #legend .row svg { width:30px; height:30px; flex:none; }
  #legend h4 { margin:0 0 6px; font-size:13px; }
  #legend .x { position:absolute; right:10px; top:6px; background:none; border:0; color:var(--mut); font-size:20px; }
  .swatch { width:30px; height:18px; border-radius:4px; background:rgba(255,23,68,.5); border:1px solid var(--red); flex:none; }

  .dm { width:42px; height:42px; position:relative; }
  .dm .ic { width:100%; height:100%; filter:drop-shadow(0 0 3px rgba(0,0,0,.9)); transform-origin:50% 50%; }
  .dm.fresh::after { content:""; position:absolute; inset:2px; border-radius:50%; border:2px solid rgba(255,255,255,.7);
    animation:pulse 1.6s ease-out infinite; pointer-events:none; }
  @keyframes pulse { from { transform:scale(.6); opacity:1; } to { transform:scale(1.5); opacity:0; } }
  .me { width:16px; height:16px; border-radius:50%; background:#2979ff; border:3px solid #fff; box-shadow:0 0 0 6px rgba(41,121,255,.3); }
  .cityLbl { background:none; border:0; box-shadow:none; color:#cfd9ec; font-size:11px; padding:0; text-shadow:0 0 3px #000, 0 0 3px #000; }
  .cityLbl:before { display:none; }
  .leaflet-popup-content-wrapper { background:var(--card); color:var(--txt); border-radius:14px; border:1px solid #2b3f68; }
  .leaflet-popup-tip { background:var(--card); }
  .leaflet-popup-content { margin:12px 14px; min-width:210px; }
  .pp h3 { margin:0 0 6px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .pp h3 svg { width:26px; height:26px; flex:none; }
  .pp .m { color:var(--mut); font-size:12px; margin:2px 0; }
  .pp .m b { color:var(--txt); font-weight:600; }
  .pp .tx { background:#0d1626; border-radius:8px; padding:6px 8px; margin:6px 0; font-size:12.5px; white-space:pre-wrap; max-height:120px; overflow:auto; }
  .pp a { color:#6ea8ff; }
  .pp .life { height:4px; background:#223253; border-radius:3px; margin-top:6px; overflow:hidden; }
  .pp .life i { display:block; height:100%; background:#ffab00; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--mut); }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <span class="dot" id="dot"></span>
  <span class="t">Карта загроз</span>
  <span class="s" id="status">Завантаження…</span>
</div>
<div id="alerts"></div>

<button class="btn fab" id="legBtn" aria-label="Легенда">ℹ︎</button>
<button class="btn fab" id="locBtn" aria-label="Моє місце">◎</button>

<div id="legend">
  <button class="x" id="legX">×</button>
  <h4>Легенда</h4>
  <div class="row"><span class="swatch"></span><span>Область з повітряною тривогою</span></div>
  <div id="legIcons"></div>
  <div class="m" style="color:#8fa0bd;font-size:12px;margin-top:6px">Дані зникають з карти через 10 хвилин після повідомлення. Це не офіційне джерело — користуйтесь офіційними застосунками тривог.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ====== настройки ======
// Если сайт и сервер на одном адресе — оставь пусто. Иначе: index.html?api=https://my-app.onrender.com
const API = (new URLSearchParams(location.search).get('api') || window.API_BASE || '').replace(/\/$/, '');
const POLL_MS = 5000;   // обновление с сервера каждые 5 с (запрос лёгкий, без Telegram)
const TTL_MS_DEFAULT = 10 * 60 * 1000;

// ====== иконки дронов (SVG, нарисованы "носом вверх", поворачиваются по курсу) ======
const ICONS = {
  shahed:  { label:'Шахед / Герань-2', color:'#ff9800', svg:'<path d="M16 2 L29 29 L16 23 L3 29 Z"/><path d="M16 9 L16 23" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>' },
  geran3:  { label:'Герань-3 (реактивний)', color:'#ff5252', svg:'<path d="M16 1 L19 12 L30 20 L30 23 L19 20 L18 28 L22 30 L22 31 L10 31 L10 30 L14 28 L13 20 L2 23 L2 20 L13 12 Z"/>' },
  geran4:  { label:'Герань-4', color:'#e040fb', svg:'<path d="M16 2 L28 23 L25 30 L16 25 L7 30 L4 23 Z"/><path d="M16 8 L16 25" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>' },
  lancet:  { label:'Ланцет', color:'#ffeb3b', svg:'<path d="M16 3 L18 14 L28 12 L28 15 L18 18 L18 26 L22 28 L22 30 L10 30 L10 28 L14 26 L14 18 L4 15 L4 12 L14 14 Z"/>' },
  molniya: { label:'Молния', color:'#18ffff', svg:'<path d="M16 4 L18 13 L27 16 L27 19 L18 18 L17 27 L20 29 L12 29 L15 27 L14 18 L5 19 L5 16 L14 13 Z"/>' },
  orlan:   { label:'Орлан-10', color:'#82b1ff', svg:'<path d="M16 3 L18 11 L30 12 L30 15 L18 15 L19 21 L23 22 L23 25 L9 25 L9 22 L13 21 L14 15 L2 15 L2 12 L14 11 Z"/>' },
  recon:   { label:'Розвідувальний (Zala/Supercam)', color:'#69f0ae', svg:'<path d="M16 3 L18 12 L29 14 L29 17 L18 17 L17 26 L21 28 L21 30 L11 30 L11 28 L15 26 L14 17 L3 17 L3 14 L14 12 Z"/>' },
  fpv:     { label:'FPV-дрон', color:'#ff80ab', svg:'<path d="M9 9 L23 23 M23 9 L9 23" stroke="#ff80ab" stroke-width="3.5" fill="none"/><circle cx="7" cy="7" r="5"/><circle cx="25" cy="7" r="5"/><circle cx="7" cy="25" r="5"/><circle cx="25" cy="25" r="5"/><circle cx="16" cy="16" r="4" fill="#ffffff"/>' },
  kab:     { label:'КАБ', color:'#cfd8dc', svg:'<path d="M16 2 L20 8 L20 22 L16 30 L12 22 L12 8 Z"/><path d="M12 24 L6 30 L12 27 Z M20 24 L26 30 L20 27 Z"/>' },
  missile: { label:'Ракета (тип невідомий)', color:'#f44336', svg:'<path d="M16 1 L19.5 8 L19.5 23 L25 29 L19.5 27 L16 31 L12.5 27 L7 29 L12.5 23 L12.5 8 Z"/><circle cx="16" cy="10" r="2" fill="#fff"/>' },
  bander:  { label:'Бандероль', color:'#ffd740', svg:'<path d="M4 8 H28 V24 H4 Z"/><path d="M4 8 L16 18 L28 8" fill="none" stroke="#000" stroke-width="1.5"/>' },
  ballistic: { label:'Балістика', color:'#ff3d00', svg:'<path d="M16 1 L20 10 L20 24 L24 30 L16 27 L8 30 L12 24 L12 10 Z"/>' },
  mig31:   { label:'МіГ-31К (носій Кинджал)', color:'#7c4dff', svg:'<path d="M16 2 L18 12 L30 18 L30 21 L18 19 L17 27 L21 29 L21 31 L11 31 L11 29 L15 27 L14 19 L2 21 L2 18 L14 12 Z"/>' },
  kinzhal: { label:'Кинджал', color:'#ff1744', svg:'<path d="M16 1 L18.5 9 L18.5 22 L26 28 L26 30 L18.5 27 L16 31 L13.5 27 L6 30 L6 28 L13.5 22 L13.5 9 Z"/><circle cx="16" cy="9" r="2" fill="#fff"/>' },
  zircon:  { label:'Циркон', color:'#00e5ff', svg:'<path d="M16 1 L18 8 L18 21 L23 27 L18 25 L16 31 L14 25 L9 27 L14 21 L14 8 Z"/>' },
  oreshnik:{ label:'Орешник', color:'#d500f9', svg:'<path d="M16 1 L21 9 L21 22 L27 29 L16 26 L5 29 L11 22 L11 9 Z"/><circle cx="16" cy="12" r="1.8" fill="#fff"/><circle cx="16" cy="18" r="1.8" fill="#fff"/>' },
  onyx:    { label:'Онікс', color:'#ffab40', svg:'<path d="M16 2 L19 8 L19 20 L24 24 L24 27 L19 25 L19 29 L16 31 L13 29 L13 25 L8 27 L8 24 L13 20 L13 8 Z"/>' },
  kh22:    { label:'Х-22 / Х-32', color:'#ff6e40', svg:'<path d="M16 1 L20 7 L20 17 L30 24 L30 27 L20 24 L19 29 L22 31 L10 31 L13 29 L12 24 L2 27 L2 24 L12 17 L12 7 Z"/>' },
  uav:     { label:'БПЛА (дрон)', color:'#ffffff', svg:'<path d="M16 3 L18 13 L28 16 L28 19 L18 18 L17 27 L20 29 L12 29 L15 27 L14 18 L4 19 L4 16 L14 13 Z"/>' },
};
function iconSvg(type, size) {
  const ic = ICONS[type] || ICONS.uav;
  return `<svg viewBox="0 0 32 32" ${size ? `width="${size}" height="${size}"` : ''} fill="${ic.color}" stroke="#000" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round">${ic.svg}</svg>`;
}
document.getElementById('legIcons').innerHTML = Object.keys(ICONS).map(k =>
  `<div class="row">${iconSvg(k)}<span>${ICONS[k].label}</span></div>`).join('');

// ====== карта ======
const map = L.map('map', { zoomControl:false, minZoom:5, maxZoom:12, worldCopyJump:false, preferCanvas:false })
  .setView([48.6, 31.5], 6);
// OpenStreetMap — ключ не нужен. Тёмная тема делается CSS-фильтром ниже.
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap', subdomains:'abc', maxZoom:19 }).addTo(map);
map.attributionControl.setPrefix(false);

let META = null;
let regionRes = [];
const regionLayers = {};       // id -> [layers]
let alertIds = new Set();

function norm(s) { return String(s).toLowerCase().replace(/ʼ|’|`/g, "'"); }
function regionIdFor(props) {
  const keys = ['name', 'name:uk', 'name_uk', 'shapeName', 'NAME_1', 'name_en', 'name:en', 'name:ru', 'name_ru', 'NAME', 'admin1Name'];
  const vals = [];
  for (const k of keys) if (typeof props[k] === 'string') vals.push(props[k]);
  for (const k of Object.keys(props)) if (typeof props[k] === 'string' && !keys.includes(k)) vals.push(props[k]);
  for (const v of vals) {
    const n = norm(v).trim();
    for (const r of regionRes) if (r.rx.test(n)) return r.id;
  }
  return null;
}
function regionStyle(id) {
  const on = alertIds.has(id);
  return on
    ? { color:'#ff1744', weight:2, fillColor:'#ff1744', fillOpacity:.45 }
    : { color:'#3a5185', weight:1, fillColor:'#1b2a47', fillOpacity:.12 };
}
function restyleRegions() {
  for (const id in regionLayers) regionLayers[id].forEach(l => l.setStyle(regionStyle(id)));
}

async function loadMeta() {
  META = await (await fetch(API + '/api/meta')).json();
  regionRes = META.regions.map(r => ({ id:r.id, rx:new RegExp(r.re, 'i') }));
  // порядок важен: Киевская область раньше города Киев — так они уже идут в списке
  // города
  const cityLayer = L.layerGroup().addTo(map);
  META.cities.forEach(c => {
    if (c.lat > 52.5 || c.lat < 44.3 && c.lng > 36) return; // РФ-точки не рисуем
    if (c.lng > 41) return;
    const m = L.circleMarker([c.lat, c.lng], { radius:2.5, color:'#9fb3d9', weight:1, fillColor:'#9fb3d9', fillOpacity:.9, interactive:false });
    m.bindTooltip(c.name, { permanent:true, direction:'right', offset:[4, 0], className:'cityLbl' });
    m._city = true;
    cityLayer.addLayer(m);
  });
  function updLabels() {
    const z = map.getZoom();
    const big = ['Київ','Харків','Одеса','Дніпро','Львів','Запоріжжя','Миколаїв','Херсон','Полтава','Суми','Чернігів','Вінниця','Житомир','Черкаси'];
    cityLayer.eachLayer(l => {
      const name = l.getTooltip().getContent();
      const isBig = big.includes(name);
      const show = z >= 8 || (z >= 6 && isBig);
      const dot = z >= 7 || isBig;
      const tip = l.getTooltip();
      if (tip && tip.getElement && tip.getElement()) tip.getElement().style.display = show ? '' : 'none';
      l.setStyle({ opacity: dot ? 1 : 0, fillOpacity: dot ? .9 : 0 });
      if (l._tipHidden !== !show) { l._tipHidden = !show; l.unbindTooltip(); l.bindTooltip(name, { permanent: show, direction:'right', offset:[4, 0], className:'cityLbl', opacity: show ? 1 : 0 }); }
    });
  }
  map.on('zoomend', updLabels);
  setTimeout(updLabels, 300);
}

async function loadGeo() {
  const gj = await (await fetch(API + '/api/geojson')).json();
  L.geoJSON(gj, {
    style: f => {
      const id = regionIdFor(f.properties || {});
      f._rid = id;
      return regionStyle(id);
    },
    onEachFeature: (f, layer) => {
      const id = f._rid || regionIdFor(f.properties || {});
      if (id) (regionLayers[id] = regionLayers[id] || []).push(layer);
      const r = META.regions.find(x => x.id === id);
      layer.on('click', () => {
        const name = r ? r.name : (f.properties.name || f.properties.shapeName || 'Область');
        const on = alertIds.has(id);
        L.popup({ closeButton:false }).setLatLng(layer.getBounds().getCenter())
          .setContent(`<div class="pp"><h3>${esc(name)}</h3><div class="m"><b>${on ? '🔴 Повітряна тривога' : '🟢 Тривоги немає'}</b></div></div>`).openOn(map);
      });
    }
  }).addTo(map).bringToBack();
  restyleRegions();
}

// ====== дроны ======
const droneObjs = {};   // id -> { d, marker, line, arrow }
let TTL = TTL_MS_DEFAULT;
let serverSkew = 0;     // разница часов сервер/телефон

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
const pad = n => String(n).padStart(2, '0');
function hhmmss(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? `${s} с тому` : `${Math.floor(s / 60)} хв ${pad(s % 60)} с тому`;
}
function nowSrv() { return Date.now() + serverSkew; }

function popupHtml(d) {
  const age = nowSrv() - d.ts;
  const left = Math.max(0, TTL - age);
  const dest = d.places && d.places.length ? d.places[d.places.length - 1] : '';
  const origin = d.fromKind === 'text' ? (d.places[0] || '') : d.fromKind === 'heading' ? 'за курсом' : 'кордон / точка запуску (приблизно)';
  const route = dest ? `${esc(origin)} → ${esc(dest)}${d.approx ? ' (приблизно, по області)' : ''}` : '';
  const f = flightProgress(d);
  const flight = d.fromLat == null ? '' : (f >= 1
    ? 'Досяг району цілі'
    : `У польоті, до цілі ≈ ${Math.max(1, Math.round((1 - f) * FLIGHT_MS / 1000))} с`);
  return `<div class="pp">
    <h3>${iconSvg(d.type, 26)}<span>${esc(d.label)}</span></h3>
    ${route ? `<div class="m">Маршрут: <b>${route}</b></div>` : ''}
    ${flight ? `<div class="m">Стан: <b>${flight}</b></div>` : ''}
    <div class="m">Повідомлено: <b>${hhmmss(d.ts)}</b> (${ago(age)})</div>
    <div class="tx">${esc(d.text)}</div>
    <div class="m">Джерело: <a href="${esc(d.link)}" target="_blank" rel="noopener">t.me/${esc(d.src)}</a></div>
    <div class="m">Зникне з карти через: <b>${Math.floor(left / 60000)}:${pad(Math.floor(left / 1000) % 60)}</b></div>
    <div class="life"><i style="width:${(left / TTL * 100).toFixed(0)}%"></i></div>
  </div>`;
}

function markerIcon(d) {
  const rot = d.heading == null ? 0 : d.heading;
  const fresh = (nowSrv() - d.ts) < 120000;
  return L.divIcon({
    className: '',
    iconSize: [42, 42], iconAnchor: [21, 21], popupAnchor: [0, -18],
    html: `<div class="dm ${fresh ? 'fresh' : ''}"><div class="ic" style="transform:rotate(${rot}deg)">${iconSvg(d.type)}</div></div>`
  });
}

// Полёт: значок стартует от границы (или города из текста) и за FLIGHT_MS долетает до цели.
// Позиция считается по времени сообщения, поэтому при открытии позже дрон уже в нужном месте.
let FLIGHT_MS = 60000;
function flightProgress(d) {
  if (d.fromLat == null) return 1;
  return Math.min(1, Math.max(0, (nowSrv() - d.ts) / FLIGHT_MS));
}
function posAt(d) {
  const f = flightProgress(d);
  if (d.fromLat == null) return [d.lat, d.lng];
  return [d.fromLat + (d.toLat - d.fromLat) * f, d.fromLng + (d.toLng - d.fromLng) * f];
}

function upsertDrone(d) {
  let o = droneObjs[d.id];
  if (!o) {
    const marker = L.marker(posAt(d), { icon: markerIcon(d), zIndexOffset: 1000 }).addTo(map);
    marker.bindPopup(() => popupHtml(droneObjs[d.id].d), { autoPanPadding:[10, 70] });
    o = droneObjs[d.id] = { d, marker, line:null };
  } else {
    o.d = d;
    o.marker.setLatLng(posAt(d)).setIcon(markerIcon(d));
  }
  if (o.line) { map.removeLayer(o.line); o.line = null; }
  if (d.fromLat != null && (d.fromLat !== d.toLat || d.fromLng !== d.toLng)) {
    o.line = L.polyline([[d.fromLat, d.fromLng], [d.toLat, d.toLng]], {
      color: (ICONS[d.type] || ICONS.uav).color, weight:2, opacity:.85, dashArray:'6 6', interactive:false }).addTo(map);
  }
}
function removeDrone(id) {
  const o = droneObjs[id]; if (!o) return;
  map.removeLayer(o.marker); if (o.line) map.removeLayer(o.line);
  delete droneObjs[id];
}

function tick() { // раз в секунду: стираем старше 10 минут, затемняем, обновляем открытый попап
  const t = nowSrv();
  for (const id of Object.keys(droneObjs)) {
    const o = droneObjs[id], age = t - o.d.ts;
    if (age > TTL) { removeDrone(id); continue; }
    const op = Math.max(.45, 1 - age / TTL * .55);
    o.marker.setOpacity(op);
    if (age < FLIGHT_MS + 1000) o.marker.setLatLng(posAt(o.d)); // двигаем только пока летит
    if (o.line) o.line.setStyle({ opacity: op * .85 });
    if (o.marker.isPopupOpen() && Math.floor(t / 1000) !== o._sec) { o._sec = Math.floor(t / 1000); o.marker.getPopup().setContent(popupHtml(o.d)); }
  }
  updateStatus();
}

// ====== опрос сервера ======
let lastOk = 0, failing = false;
function updateStatus() {
  const n = Object.keys(droneObjs).length;
  document.getElementById('dot').className = 'dot ' + (failing ? 'bad' : (lastOk ? 'ok' : ''));
  document.getElementById('status').textContent = failing
    ? 'Немає зв’язку з сервером'
    : `Цілей: ${n} · тривог: ${alertIds.size} · оновлено ${lastOk ? hhmmss(lastOk) : '—'}`;
}
async function refresh() {
  try {
    const j = await (await fetch(API + '/api/state', { cache:'no-store' })).json();
    serverSkew = j.now - Date.now();
    TTL = j.ttlMs || TTL_MS_DEFAULT;
    FLIGHT_MS = j.flightMs || FLIGHT_MS;
    const ids = new Set();
    j.drones.forEach(d => { if (j.now - d.ts <= TTL) { ids.add(d.id); upsertDrone(d); } });
    Object.keys(droneObjs).forEach(id => { if (!ids.has(id)) removeDrone(id); });
    alertIds = new Set(j.alerts.map(a => a.id));
    restyleRegions();
    const box = document.getElementById('alerts');
    if (alertIds.size) {
      box.style.display = 'block';
      box.textContent = '🔴 Тривога: ' + [...alertIds].map(id => (META.regions.find(r => r.id === id) || {}).name || id).join(', ');
    } else box.style.display = 'none';
    lastOk = Date.now(); failing = false;
  } catch (e) { failing = true; }
  updateStatus();
}

// ====== моё местоположение ======
let meMarker = null, firstFix = true;
function startGeo() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.marker(ll, { icon:L.divIcon({ className:'', html:'<div class="me"></div>', iconSize:[16, 16], iconAnchor:[8, 8] }), interactive:false, zIndexOffset:2000 }).addTo(map);
    else meMarker.setLatLng(ll);
    if (firstFix) { firstFix = false; map.setView(ll, 8); }
  }, () => {}, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
}
document.getElementById('locBtn').onclick = () => {
  if (meMarker) map.setView(meMarker.getLatLng(), Math.max(map.getZoom(), 9));
  else { firstFix = true; startGeo(); }
};
const leg = document.getElementById('legend');
document.getElementById('legBtn').onclick = () => leg.style.display = leg.style.display === 'block' ? 'none' : 'block';
document.getElementById('legX').onclick = () => leg.style.display = 'none';

// ====== запуск ======
(async () => {
  try { await loadMeta(); } catch (e) { document.getElementById('status').textContent = 'Сервер недоступний'; }
  loadGeo().catch(() => {});
  startGeo();
  await refresh();
  setInterval(refresh, POLL_MS);
  setInterval(tick, 500);
})();
</script>
